name = "ajay-portfolio"
compatibility_date = "2025-01-01"
pages_build_output_dir = "./public"

# Where admin edits are saved. Create it with:
#   npx wrangler kv namespace create CONTENT
# then paste the id it prints below.
[[kv_namespaces]]
binding = "CONTENT"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
# From Cloudflare Zero Trust (see README.md, step 4)
TEAM_DOMAIN = ""   # e.g. "ajay.cloudflareaccess.com"
POLICY_AUD = ""    # the Access application's "Application Audience (AUD) Tag"
ADMIN_EMAILS = ""  # comma-separated emails allowed to edit, e.g. "you@example.com"
