name = "ajay-hearn-portfolio"
compatibility_date = "2025-01-01"
pages_build_output_dir = "./public"

# Where admin edits are saved. Create it with:
#   npx wrangler kv namespace create CONTENT
# then paste the id it prints below.
[[kv_namespaces]]
binding = "CONTENT"
id = "1e39c390957448aaa3840771f8bd34d8"

# Admin login settings are stored as Cloudflare secrets (not here, because this file is public):
#   TEAM_DOMAIN   e.g. "ajay.cloudflareaccess.com"
#   POLICY_AUD    the Access application's "Application Audience (AUD) Tag"
#   ADMIN_EMAILS  comma-separated emails allowed to edit
# Set each one with:  npx wrangler pages secret put <NAME> --project-name ajay-hearn-portfolio

[vars]
# Cloudflare Turnstile site key for the contact form. This one is public (it's sent to every visitor);
# the matching TURNSTILE_SECRET_KEY is a secret set in the Cloudflare dashboard.
TURNSTILE_SITE_KEY = "0x4AAAAAAGMDYrjiqIp3o0Hf"
