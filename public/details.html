<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ajay Hearn | Portfolio</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☁️</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <script>
    (function () {
      const saved = localStorage.getItem("theme");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = saved || (prefersDark ? "dark" : "light");
    })();
  </script>
</head>
<body>
  <div class="sky" aria-hidden="true">
    <div class="stars"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
    <div class="cloud c4"></div>
    <div class="cloud c5"></div>
  </div>

  <header class="nav">
    <a href="/" class="logo">☁️ <span id="logo-first">Ajay</span><span class="accent" id="logo-last">.H</span></a>
    <nav>
      <ul class="nav-links">
        <li><a href="/#about">About</a></li>
        <li><a href="/#skills">Skills</a></li>
        <li><a href="/#projects">Projects</a></li>
        <li><a href="/#experience">Experience</a></li>
        <li><a href="/#education">Education</a></li>
        <li><a href="/#references">References</a></li>
        <li><a href="/#contact">Contact</a></li>
      </ul>
    </nav>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
      <span class="icon-sun">☀️</span><span class="icon-moon">🌙</span>
    </button>
  </header>

  <main class="details-page">
    <a id="back" class="back-link" href="/">← Back</a>
    <article class="card details-card" id="details">
      <p class="message">Loading…</p>
    </article>
  </main>

  <footer class="footer">
    <p>© <span id="year"></span> <span id="footer-name">Ajay Hearn</span> &middot; Built by hand and deployed to the cloud ☁️</p>
  </footer>

  <script src="/common.js"></script>
  <script src="/details.js"></script>
</body>
</html>
