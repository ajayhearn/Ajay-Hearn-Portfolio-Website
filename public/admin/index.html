<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Admin | Portfolio</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☁️</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>
  <header class="topbar">
    <strong>☁️ Portfolio admin</strong>
    <span id="who" class="who"></span>
    <div class="actions">
      <span id="status" class="status" role="status"></span>
      <a href="/" target="_blank" rel="noopener" class="btn ghost">View site ↗</a>
      <button id="save" class="btn primary" disabled>Save changes</button>
      <button id="logout" class="btn ghost" hidden>Log out</button>
    </div>
  </header>

  <main>
    <form id="login" class="login" hidden>
      <h1>Admin login</h1>
      <label class="field">
        <span>Password</span>
        <input type="password" id="password" autocomplete="current-password" required autofocus />
      </label>
      <button type="submit" class="btn primary">Log in</button>
      <p id="login-error" class="message error" role="alert"></p>
    </form>
    <p id="message" class="message">Loading…</p>
    <form id="editor" hidden></form>
  </main>

  <script src="/admin/admin.js"></script>
</body>
</html>
