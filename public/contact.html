<head>
  <meta charset="UTF-8" />

  <meta name="description" content="Send Ajay Hearn a message." />
  <link rel="canonical" href="https://ajay-hearn-portfolio.pages.dev/contact" />
  <!-- Link previews (LinkedIn, WhatsApp, Discord, Teams, iMessage, X...) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Ajay Hearn" />
  <meta property="og:title" content="Contact Ajay Hearn" />
  <meta property="og:description" content="Send Ajay Hearn a message." />
  <meta property="og:url" content="https://ajay-hearn-portfolio.pages.dev/contact" />
  <meta property="og:image" content="https://ajay-hearn-portfolio.pages.dev/og-image.png?v=2" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Ajay Hearn: T Level Digital Support and Security student with Amazon (IMDb) and NHS industry placements, applying for Solutions Architect degree apprenticeships." />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☁️</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <script src="/prefs.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <noscript><p class="noscript">This site needs JavaScript turned on to show its content.</p></noscript>
  <div class="sky" aria-hidden="true">
    <div class="stars"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
    <div class="cloud c4"></div>
    <div class="cloud c5"></div>
  </div>

  <header class="nav">
    <a href="/" class="logo" aria-label="Ajay, home page"><span class="logo-cloud" aria-hidden="true">☁️</span> <span id="logo-first">Ajay</span></a>
    <nav aria-label="Main">
      <ul class="nav-links" id="site-menu">
        <li><a href="/#about">About</a></li>
        <li><a href="/#skills">Skills</a></li>
        <li><a href="/#education">Education</a></li>
        <li><a href="/#experience">Experience</a></li>
        <li><a href="/#projects">Projects</a></li>
        <li hidden><a href="/#references">References</a></li>
        <li><a href="/#contact">Contact</a></li>
      </ul>
    </nav>
    <div class="nav-controls">
      <button class="icon-btn menu-toggle" id="menuToggle" aria-expanded="false" aria-controls="site-menu" aria-label="Menu">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>
      </button>
      <!-- The accessibility button and its settings panel are added here by common.js -->
      <button class="theme-toggle icon-btn" id="themeToggle" aria-pressed="false" aria-label="Dark mode">
        <span class="icon-sun" aria-hidden="true">☀️</span><span class="icon-moon" aria-hidden="true">🌙</span>
      </button>
    </div>
  </header>

  <main class="details-page" id="main" tabindex="-1">
    <a class="back-link" href="/">&larr; Back to the home page</a>
    <article class="card details-card">
      <h1>Contact me</h1>
      <p class="summary">Send me a message and I'll reply by email.</p>
      <form id="contact-form" class="contact-form">
        <label class="form-field">
          <span>Your name</span>
          <input name="name" autocomplete="name" required maxlength="100" />
        </label>
        <label class="form-field">
          <span>Your email</span>
          <input name="email" type="email" autocomplete="email" required maxlength="200" />
        </label>
        <label class="form-field">
          <span>Message</span>
          <textarea name="message" required minlength="10" maxlength="2000" rows="7"></textarea>
          <small id="char-count" aria-live="off">0 / 2000</small>
        </label>
        <!-- Hidden from people; spam bots tend to fill it in -->
        <div class="hp" aria-hidden="true">
          <label>Leave this empty <input name="website" tabindex="-1" autocomplete="off" /></label>
        </div>
        <button type="submit" class="btn primary">Send message</button>
        <p id="form-status" class="form-status" role="status"></p>
      </form>
    </article>
  </main>

  <footer class="footer">
    <p>© <span id="year"></span> <span id="footer-name">Ajay Hearn</span> &middot; <a href="/how-its-built">How I built this site</a></p>
  </footer>

  <script src="/common.js"></script>
  <script src="/contact.js"></script>
</body>
</html>
