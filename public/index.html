<body id="top">
  <a class="skip-link" href="#main">Skip to main content</a>
  <noscript><p class="noscript">This site needs JavaScript turned on to show its content.</p></noscript>
  <!-- Animated sky background -->
  <div class="sky" aria-hidden="true">
    <div class="stars"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
    <div class="cloud c4"></div>
    <div class="cloud c5"></div>
  </div>

  <header class="nav">
   <div class="nav-pill">
      <a href="#top" class="logo" aria-label="Ajay, back to top"><span class="logo-cloud" aria-hidden="true">☁️</span> <span data-field="firstName">Ajay</span></a>
      <nav aria-label="Main">
        <ul class="nav-links" id="site-menu">
          <li><a href="/">Home</a></li>
          <li><a href="/experience">Experience</a></li>
          <li><a href="/projects">Projects</a></li>
          <li><a href="/contact">Contact</a></li>
        </ul>
      </nav>
      <div class="nav-controls">
        <button class="icon-btn menu-toggle" id="menuToggle" aria-expanded="false" aria-controls="site-menu" aria-label="Menu">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>
        </button>
        <!-- The accessibility button and its settings panel are added here by common.js -->
        <button class="theme-toggle icon-btn" id="themeToggle" aria-pressed="false" aria-label="Dark mode">
          <span class="icon-sun" aria-hidden="true">☀️</span><span class="icon-moon" aria-hidden="true">🌙</span>
        </button>
      </div>
    </div>
  </header>

  <!-- All text below is filled in by script.js from the content saved in the admin panel -->
  <main id="main" tabindex="-1">
    <section class="hero">
      <div class="hero-text">
        <p class="eyebrow">Hi, I'm</p>
        <h1 data-field="name"></h1>
        <p class="tagline" data-field="tagline"></p>
        <p class="lead" data-field="intro"></p>
        <div class="hero-cta">
          <a href="/experience#education" class="btn primary">View my education</a>
          <a href="/experience#experience" class="btn primary">View my experience</a>
          <a href="/contact" class="btn ghost">Get in touch</a>
        </div>
      </div>

      <div class="terminal" role="region" aria-label="Profile summary">
        <div class="terminal-bar" aria-hidden="true">
          <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
          <span class="terminal-title">~/cloud</span>
        </div>
        <pre class="terminal-body"><code id="typed"></code><span class="cursor" aria-hidden="true">▋</span></pre>
      </div>
    </section>

    <section id="about" class="section">
      <h2>About me</h2>
      <div class="card about-card" id="about-body"></div>
    </section>

  </main>

  <footer class="footer">
    <div class="footer-inner">
      <p>© <span id="year"></span> <span id="footer-name">Ajay Hearn</span></p>
      <nav aria-label="Footer">
        <ul class="footer-links" id="footer-links">
          <li><a href="/contact">Contact</a></li>
          <li><a href="/how-its-built">How I built this site</a></li>
